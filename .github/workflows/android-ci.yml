name: Android CI

# Sistema anti-regresiones: cada push/PR corre los unit tests (JVM + Robolectric).
# Con branch protection en main, un test rojo bloquea el merge.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # OJO: el input por defecto es «tools platform-tools» y Google retiró el
          # paquete `tools` (jul-2025): el setup fallaba y TODO el CI quedaba en rojo.
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (flavor normal, build debug)
        run: ./gradlew :app:testNormalDebugUnitTest --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # OJO: el input por defecto es «tools platform-tools» y Google retiró el
          # paquete `tools` (jul-2025): el setup fallaba y TODO el CI quedaba en rojo.
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Valida las reglas R8 en cada push (sin secretos: si no hay keystore, firma debug).
      - name: Build minified release (R8 keep rules)
        run: ./gradlew :app:assembleNormalRelease --stacktrace

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server test deps
        run: pip install pytest pycryptodome asyncpg fastapi

      - name: Run server tests (sync + api, sin red ni DB)
        run: python -m pytest server/tests -q
