<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b13" />
    <title>Abrir Vision+ Party</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #070b13; }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f7faff;
        background:
          radial-gradient(circle at 50% 0%, rgba(45, 125, 246, 0.2), transparent 45%),
          #070b13;
      }
      .card {
        width: min(430px, 100%);
        padding: 28px 24px 24px;
        border: 1px solid rgba(56, 189, 248, 0.22);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .eyebrow { margin: 0 0 8px; color: #7dd3fc; font-size: 12px; font-weight: 800; letter-spacing: 0.22em; }
      h1 { margin: 0; font-size: 25px; line-height: 1.1; }
      .code {
        margin: 18px 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(42px, 14vw, 64px);
        font-weight: 900;
        letter-spacing: 0.12em;
        color: #38bdf8;
      }
      .hint, .note { margin: 0; color: #a9b4c6; font-size: 14px; line-height: 1.45; }
      .actions { display: grid; gap: 10px; margin: 20px 0 16px; }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 16px;
        font-weight: 800;
        text-decoration: none;
      }
      .primary { background: linear-gradient(135deg, #facc15, #fb923c); color: #1a1206; }
      .secondary { border: 1px solid rgba(148, 163, 184, 0.3); background: rgba(30, 41, 59, 0.78); color: #e2e8f0; }
      .note { font-size: 12px; color: #64748b; }
      .error { color: #fca5a5; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">VISION+ PARTY</p>
      <h1>Entrar a la sala</h1>
      <p class="code" id="code">----</p>
      <p class="hint" id="hint">Te estamos llevando al mando en la app de Vision+.</p>
      <div class="actions">
        <a class="btn primary" id="app" href="#">Abrir en Vision+</a>
        <a class="btn secondary" id="web" href="#">Jugar en el navegador</a>
      </div>
      <p class="note" id="note">Si no se abre sola, toca “Abrir en Vision+”.</p>
    </main>
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const code = (params.get("room") || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
        const codeEl = document.getElementById("code");
        const app = document.getElementById("app");
        const web = document.getElementById("web");
        const hint = document.getElementById("hint");
        const note = document.getElementById("note");
        if (code.length !== 4) {
          codeEl.textContent = "----";
          hint.textContent = "Falta el código de sala.";
          hint.classList.add("error");
          app.hidden = true;
          web.hidden = true;
          return;
        }
        codeEl.textContent = code;
        const deep = `visionplus://play/join?room=${encodeURIComponent(code)}`;
        const fallback = `/controller/?fresh=1&cb=${Date.now()}#join?room=${encodeURIComponent(code)}`;
        app.href = deep;
        web.href = fallback;
        let pageHidden = false;
        document.addEventListener("visibilitychange", () => { if (document.hidden) pageHidden = true; });
        // Intento silencioso; los botones quedan como respaldo si el teléfono no tiene la app.
        setTimeout(() => {
          if (!pageHidden && document.visibilityState === "visible") location.href = deep;
        }, 450);
      })();
    </script>
  </body>
</html>
