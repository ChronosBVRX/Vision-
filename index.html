<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando a Vision+</title>
    <meta http-equiv="refresh" content="0; url=https://collecting-offset-closer-contribute.trycloudflare.com">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0b14;
            color: #f3f1f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(16px);
            max-width: 400px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 77, 255, 0.1);
            border-top: 3px solid #7c4dff;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #9c97aa; font-size: 0.95rem; margin-bottom: 1.5rem; }
        a {
            color: #b388ff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { text-decoration: underline; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
        window.location.replace("https://collecting-offset-closer-contribute.trycloudflare.com");
    </script>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Redireccionando a Vision+</h1>
        <p>Cargando tu servidor multimedia inteligente...</p>
        <a href="https://collecting-offset-closer-contribute.trycloudflare.com">Haz clic aquí si no eres redirigido automáticamente</a>
    </div>
</body>
</html>
