<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vision+</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0b14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .loader-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0b14;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(16px);
            max-width: 400px;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(124, 77, 255, 0.1);
            border-top: 3px solid #7c4dff;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f3f1f6; }
        p { color: #9c97aa; font-size: 0.95rem; margin-bottom: 1.5rem; }
        a {
            color: #b388ff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { text-decoration: underline; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="loader-card">
            <div class="spinner"></div>
            <h1>Vision+</h1>
            <p id="status">Iniciando...</p>
            <a id="direct-link" href="#" target="_blank">Abrir directamente</a>
        </div>
    </div>
    <script>
        var TUNNEL_URL = 'https://begin-vegas-lime-sherman.trycloudflare.com';
        var loader = document.getElementById('loader');
        var statusEl = document.getElementById('status');
        var directLink = document.getElementById('direct-link');

        directLink.href = TUNNEL_URL;

        // Intentar cargar la app directamente (sin iframe)
        statusEl.textContent = 'Conectando con tu servidor inteligente...';

        // Redirigir al tunnel — la app corre en el frame principal
        window.location.href = TUNNEL_URL;

        // Si después de 8 segundos seguimos aquí (tunnel caído o lento),
        // mostrar opciones al usuario
        var fallbackTimer = setTimeout(function() {
            statusEl.innerHTML = 'El servidor no responde.<br>Puedes intentar abrir el enlace directo:';
            directLink.style.display = 'inline';
        }, 8000);
    </script>
</body>
</html>
