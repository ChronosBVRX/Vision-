<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision+</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0b14;
            color: #f3f1f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            text-align: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 2.5rem;
            border-radius: 20px;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(124,77,255,0.1);
            border-top: 3px solid #7c4dff;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #9c97aa; font-size: 0.95rem; margin-bottom: 1.5rem; }
        a { color: #b388ff; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Redirigiendo a Vision+</h1>
        <p>Si no eres redirigido automáticamente, <a href="https://model-hide-sponsorship-demonstrates.trycloudflare.com">haz clic aquí</a>.</p>
    </div>
    <script>window.location.href = "https://model-hide-sponsorship-demonstrates.trycloudflare.com";</script>
</body>
</html>
