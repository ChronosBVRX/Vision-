<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision+</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0b14;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 9999;
            background-color: #0d0b14;
        }
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d0b14;
            z-index: 9998;
            transition: opacity 0.5s ease;
        }
        .loader-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(16px);
            max-width: 400px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(124, 77, 255, 0.1);
            border-top: 3px solid #7c4dff;
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f3f1f6; }
        p { color: #9c97aa; font-size: 0.95rem; margin-bottom: 1.5rem; }
        a {
            color: #b388ff;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover { text-decoration: underline; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader" class="loader-container">
        <div class="loader-card">
            <div class="spinner"></div>
            <h1>Cargando Vision+</h1>
            <p>Conectando con tu servidor inteligente...</p>
            <a href="https://express-know-interracial-worldcat.trycloudflare.com" target="_blank">Haz clic aquí para abrir directamente</a>
        </div>
    </div>
    <iframe src="https://express-know-interracial-worldcat.trycloudflare.com" 
            id="app-frame"
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            allow="autoplay; encrypted-media; picture-in-picture; clipboard-write; microphone; camera; geolocation" 
            referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <script>
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');
        
        iframe.onload = function() {
            loader.style.opacity = 0;
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        };

        setTimeout(() => {
            if (loader.style.display !== 'none') {
                const p = loader.querySelector('p');
                if (p) p.innerHTML = 'La conexión está tardando más de lo normal.<br>Puedes intentar abrir el enlace directamente:';
            }
        }, 10000);
    </script>
</body>
</html>
