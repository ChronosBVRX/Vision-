<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vision+ Cast Receiver</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      cast-media-player {
        width: 100%;
        height: 100%;
        --theme-hue: 358;
        --progress-color: #e50914;
        --splash-image: none;
        --splash-background-color: #000;
        --watermark-image: none;
      }

      .brand {
        position: fixed;
        left: 32px;
        top: 28px;
        z-index: 2;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.86);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="brand">Vision+</div>
    <cast-media-player></cast-media-player>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script>
      const context = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();

      playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (request) => {
        if (request.media && request.media.contentUrl && !request.media.contentId) {
          request.media.contentId = request.media.contentUrl;
        }
        return request;
      });

      context.start({
        disableIdleTimeout: true,
        supportedCommands: cast.framework.messages.Command.ALL_BASIC_MEDIA
      });
    </script>
  </body>
</html>
