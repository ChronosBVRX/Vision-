name: streaming-backend

# Compose del índice Vision+ (fase 1) para el VPS OCI compartido con La Veinte:
#   - NO incluye Caddy: el Caddy nativo del host (80/443) hace el reverse proxy.
#   - Postgres NO publica 5432/6543: vive solo en la red interna.
#   - Solo la API se expone, y únicamente en 127.0.0.1:8100 (el host no abre nada nuevo).
# Secretos: copiar .env.example a .env y completar (ver README).

services:
  postgres:
    image: postgres:16-alpine
    container_name: streaming-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-catalog_db}"
      POSTGRES_USER: "${POSTGRES_USER:-catalog_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en server/.env}"
      TZ: "${TZ:-America/Mexico_City}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog_user} -d ${POSTGRES_DB:-catalog_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: streaming-api:local
    container_name: streaming-api
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-catalog_user}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-catalog_db}"
      API_KEY: "${API_KEY:?define API_KEY en server/.env}"
      CONFIG_ADMIN_KEY: "${CONFIG_ADMIN_KEY:-}"
      # Espejo de capítulos: TTL de la copia (vencida → se encarga el refresco y
      # la app cae al portal) y cooldown anti-martillo de la cola.
      EPISODES_TTL_HOURS: "${EPISODES_TTL_HOURS:-48}"
      EPISODES_REQUEST_COOLDOWN_MINUTES: "${EPISODES_REQUEST_COOLDOWN_MINUTES:-10}"
      EPISODES_FAILED_RETRY_HOURS: "${EPISODES_FAILED_RETRY_HOURS:-24}"
      TZ: "${TZ:-America/Mexico_City}"
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # El índice completo se materializa en memoria al servir /v1/index (52k títulos):
    # con 512 MB el OOM killer tumbaba el contenedor a media respuesta. 1 GB deja aire
    # para el payload y la caché por versión (el host tiene 22 GB).
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    image: streaming-sync:local
    container_name: streaming-sync
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-catalog_user}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-catalog_db}"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-21600}"
      SEED_DEMO: "${SEED_DEMO:-0}"
      XTV_SYNC: "${XTV_SYNC:-1}"
      MAGIS_SYNC: "${MAGIS_SYNC:-1}"
      IA_SYNC: "${IA_SYNC:-1}"
      XTV_MAX_PAGES: "${XTV_MAX_PAGES:-0}"
      XTV_COLLECTION_PAGES: "${XTV_COLLECTION_PAGES:-3}"
      XTV_COLLECTION_DEEP_PAGES: "${XTV_COLLECTION_DEEP_PAGES:-100}"
      XTV_DEEP_EVERY_HOURS: "${XTV_DEEP_EVERY_HOURS:-168}"
      XTV_DEEP_MIN_FREE_GB: "${XTV_DEEP_MIN_FREE_GB:-2}"
      XTV_SERIES_COLLECTION_PAGES: "${XTV_SERIES_COLLECTION_PAGES:-0}"
      XTV_PAGE_DELAY_SECONDS: "${XTV_PAGE_DELAY_SECONDS:-0.15}"
      XTV_SERVER_SN: "${XTV_SERVER_SN:-}"
      SPORTS_SYNC: "${SPORTS_SYNC:-1}"
      SPORTS_INTERVAL_SECONDS: "${SPORTS_INTERVAL_SECONDS:-600}"
      # GeeSports V3.8 (deportes en vivo): ciclo propio y clave de su CMS.
      # La clave es SECRETA: vive solo en el .env del VPS, nunca en el repo.
      GEE38_SYNC: "${GEE38_SYNC:-1}"
      GEE38_INTERVAL_SECONDS: "${GEE38_INTERVAL_SECONDS:-1800}"
      GEE38_KEY: "${GEE38_KEY:-}"
      # Espejo de capítulos/temporadas (`/v1/episodes`): drena la cola pedida por
      # el API con la sesión del worker (jamás acuña). Tope/ritmo conservadores.
      EPISODES_SYNC: "${EPISODES_SYNC:-1}"
      EPISODES_INTERVAL_SECONDS: "${EPISODES_INTERVAL_SECONDS:-90}"
      EPISODES_MAX_PER_CYCLE: "${EPISODES_MAX_PER_CYCLE:-30}"
      EPISODES_DELAY_SECONDS: "${EPISODES_DELAY_SECONDS:-0.25}"
      EPISODES_RETRY_HOURS: "${EPISODES_RETRY_HOURS:-6}"
      EPISODES_MAX_ATTEMPTS: "${EPISODES_MAX_ATTEMPTS:-6}"
      # Nombre real y sinopsis por capítulo (TMDB): una petición por temporada,
      # guardada en `episode_meta`. Presupuesto y TTL del refresco.
      EPISODES_META_SYNC: "${EPISODES_META_SYNC:-1}"
      EPISODES_META_MAX_PER_CYCLE: "${EPISODES_META_MAX_PER_CYCLE:-20}"
      EPISODES_META_TTL_HOURS: "${EPISODES_META_TTL_HOURS:-336}"
      EPISODES_META_RETRY_HOURS: "${EPISODES_META_RETRY_HOURS:-24}"
      EPISODES_META_MAX_ATTEMPTS: "${EPISODES_META_MAX_ATTEMPTS:-4}"
      # Pre-calentamiento popular: temporadas de los grupos con más impacto +
      # series sueltas más populares, para que la primera vez también sea instantánea.
      EPISODES_META_PREWARM: "${EPISODES_META_PREWARM:-1}"
      EPISODES_META_PREWARM_GROUPS: "${EPISODES_META_PREWARM_GROUPS:-500}"
      EPISODES_META_PREWARM_SINGLES: "${EPISODES_META_PREWARM_SINGLES:-500}"
      EPISODES_META_PREWARM_MAX_PER_CYCLE: "${EPISODES_META_PREWARM_MAX_PER_CYCLE:-120}"
      DIAG_INTERVAL_SECONDS: "${DIAG_INTERVAL_SECONDS:-300}"
      DIAG_RESOLVE_HOURS: "${DIAG_RESOLVE_HOURS:-48}"
      # Salud del catálogo: avisa si el ciclo de sync (6 h) o la pasada profunda
      # semanal dejan de correr. Sin esto, el catálogo se queda viejo en silencio.
      DIAG_CATALOG_STALE_HOURS: "${DIAG_CATALOG_STALE_HOURS:-10}"
      DIAG_DEEP_STALE_DAYS: "${DIAG_DEEP_STALE_DAYS:-8}"
      DIAG_HEALTH_COOLDOWN_HOURS: "${DIAG_HEALTH_COOLDOWN_HOURS:-12}"
      DIAG_ALERT_WEBHOOK: "${DIAG_ALERT_WEBHOOK:-}"
      DIAG_TELEGRAM_TOKEN: "${DIAG_TELEGRAM_TOKEN:-}"
      DIAG_TELEGRAM_CHAT: "${DIAG_TELEGRAM_CHAT:-}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      ENRICH_BATCH: "${ENRICH_BATCH:-300}"
      ENRICH_DELAY_SECONDS: "${ENRICH_DELAY_SECONDS:-0.25}"
      # Re-match del backlog «sin match»: lote por ciclo (el candado por versión permite
      # subirlo para catch-ups sin esperar el enfriamiento) y días de enfriamiento.
      TMDB_REMATCH_BATCH: "${TMDB_REMATCH_BATCH:-2500}"
      TMDB_REMATCH_COOLDOWN_DAYS: "${TMDB_REMATCH_COOLDOWN_DAYS:-14}"
      TMDB_BACKFILL_BATCH: "${TMDB_BACKFILL_BATCH:-3000}"
      # Nombres para buscar (es-MX/original/regionales) de matches ya hechos: lote por
      # ciclo y ritmo propio (una llamada por título conocido, sin búsqueda).
      TMDB_ALIAS_BATCH: "${TMDB_ALIAS_BATCH:-1500}"
      TMDB_ALIAS_GAP_SECONDS: "${TMDB_ALIAS_GAP_SECONDS:-0.08}"
      # Texto de búsqueda materializado: títulos por ciclo que se rehacen de más.
      SEARCH_TEXT_BATCH: "${SEARCH_TEXT_BATCH:-20000}"
      TZ: "${TZ:-America/Mexico_City}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streaming-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  streaming-net:
    driver: bridge

volumes:
  pgdata:
